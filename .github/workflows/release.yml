name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build for macOS
        run: npm run dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        id: create_release
        with:
          files: |
            dist/*.dmg
            dist/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Homebrew Cask
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          
          # Calculate SHA256 from local artifacts
          SHA256_ARM=$(shasum -a 256 dist/PhotoSlide-${VERSION}-arm64.dmg | awk '{print $1}')
          SHA256_X64=$(shasum -a 256 dist/PhotoSlide-${VERSION}-x64.dmg | awk '{print $1}')
          
          # Clone tap repository
          git clone https://x-access-token:${{ secrets.HOMEBREW_TAP_TOKEN }}@github.com/blue1st/homebrew-taps.git homebrew-taps
          
          CASK_FILE="homebrew-taps/Casks/photo-slide.rb"
          mkdir -p homebrew-taps/Casks
          
          cat <<EOF > $CASK_FILE
          cask "photo-slide" do
            arch arm: "arm64", intel: "x64"

            version "$VERSION"
            sha256 arm:   "$SHA256_ARM",
                   intel: "$SHA256_X64"

            url "https://github.com/${{ github.repository }}/releases/download/v#{version}/PhotoSlide-#{version}-#{arch}.dmg"
            name "PhotoSlide"
            desc "Simple photo slideshow application"
            homepage "https://github.com/${{ github.repository }}"

            app "PhotoSlide.app"
            
            postflight do
              system_command "xattr",
                             args: ["-cr", "#{appdir}/PhotoSlide.app"],
                             sudo: false
            end

            zap trash: [
              "~/Library/Application Support/photo-slide",
              "~/Library/Preferences/com.kawasaki.photo-slide.plist",
              "~/Library/Saved Application State/com.kawasaki.photo-slide.savedState",
            ]
          end
          EOF
          
          # Commit and Push
          cd homebrew-taps
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/photo-slide.rb
          git commit -m "Update photo-slide to ${VERSION}" || exit 0
          git push
