<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Photo Slide</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="dark-theme">
  <div id="app">
    <header id="top-bar">
      <div class="toolbar-row">
        <div class="toolbar-left">
          <div class="open-group">
            <button id="btn-open" title="画像フォルダを選択して開きます">フォルダを開く</button>
            <div class="history-dropdown">
              <button id="btn-history-toggle" title="最近開いたフォルダ">履歴 ▾</button>
              <div id="history-popup" class="history-popup hidden">
                <div id="history-items"></div>
              </div>
            </div>
          </div>
          <div class="file-info-group">
            <span id="file-name">ファイルを選択してください</span>
          </div>
          <div class="file-actions">
            <button id="btn-rename-trigger" title="名前変更">✎</button>
            <button id="btn-copy-trigger" title="コピー">📄</button>
            <button id="btn-move-trigger" title="移動">📦</button>
            <button id="btn-delete-trigger" title="ゴミ箱へ">🗑</button>
          </div>
          <span id="display-mode-label">モード: 収まる</span>
        </div>
        <div class="toolbar-right">
          <div id="tag-editor">
            <div id="current-tags-container"></div>
            <div class="add-tag-group">
              <input type="text" id="input-single-tag" list="tag-suggestions" placeholder="タグを入力してEnter">
              <button id="btn-add-tag" title="新しいタグを追加する">+</button>
              <datalist id="tag-suggestions"></datalist>
            </div>
          </div>
        </div>
      </div>
      
      <div class="filter-row">
        <span class="label">タグ絞り込み:</span>
        <button id="btn-untagged-filter" title="タグのない画像のみを表示する">タグなしのみ</button>
        <div id="all-tags-list"></div>
        <button id="btn-clear-filter" title="タグ絞り込みをリセットする">クリア</button>
      </div>
    </header>

    <div id="rename-modal" class="modal">
      <div class="modal-content">
        <h3>ファイル名の変更</h3>
        <input type="text" id="input-new-name">
        <div class="modal-buttons">
          <button id="btn-rename-cancel" title="変更を破棄して閉じる">キャンセル</button>
          <button id="btn-rename-confirm" title="新しいファイル名を保存する">適用</button>
        </div>
      </div>
    </div>

    <main id="viewer">
      <div id="welcome-view">
        <div class="welcome-content">
          <div class="welcome-icon">
            <img src="icon.png" alt="App Icon" class="welcome-icon-img">
          </div>
          <h2>ようこそ</h2>
          <p>「フォルダを開く」ボタンから画像フォルダを選択してください</p>
        </div>
      </div>
      <img id="main-image" src="" alt="Photo" style="display: none;" draggable="false">
      <div id="grid-view" class="hidden"></div>
      <div id="controls" class="hidden">
        <button id="btn-prev" title="前の画像へ (ArrowLeft / a)">◀</button>
        <button id="btn-next" title="次の画像へ (ArrowRight / d)">▶</button>
      </div>
      
      <div id="selection-indicator" class="selection-indicator hidden">
        <span id="selection-count-text">0個選択中</span>
        <div class="selection-actions">
          <button id="btn-open-bulk" class="primary-btn">一括編集</button>
          <button id="btn-clear-selection" title="選択をすべて解除">解除 ✕</button>
        </div>
      </div>
    </main>

    <div id="labeling-overlay" class="overlay-hidden">
      <div class="overlay-inner">
        <div class="overlay-header">
          <h3>ラベル付け</h3>
          <span class="hint">タグをドラッグして画像にドロップしてください</span>
        </div>
        <div class="overlay-content">
          <div id="tag-palette" class="tag-palette">
            <!-- Tags will be rendered here -->
          </div>
          <div id="drop-target" class="drop-target">
            <div id="image-preview-container">
               <img id="overlay-img" src="" alt="Overlay Preview" draggable="false">
               <div id="overlay-tags-display"></div>
            </div>
          </div>
        </div>
        <div class="overlay-footer">
           <input type="text" id="overlay-new-tag-input" placeholder="新しいタグを追加...">
           <button id="btn-overlay-add-tag">追加</button>
           <button id="btn-close-overlay">閉じる (Space)</button>
        </div>
      </div>
    </div>

    <div id="bulk-labeling-overlay" class="overlay-hidden">
      <div class="overlay-inner bulk-inner">
        <div class="overlay-header">
          <h3>一括ラベル付け</h3>
          <span id="bulk-selection-count" class="hint">0個のファイルが選択されています</span>
        </div>
        <div class="overlay-content bulk-content">
          <div class="bulk-tags-section">
            <h4>選択された画像</h4>
            <div id="bulk-selected-thumbnails" class="bulk-thumbnails-container"></div>
          </div>
          <div class="bulk-tags-section">
            <h4>追加するタグ</h4>
            <div id="bulk-add-tags-container" class="tag-container-box"></div>
            <div class="bulk-input-group">
              <input type="text" id="input-bulk-add-tag" list="tag-suggestions" placeholder="タグを入力してEnterで追加リストへ">
            </div>
          </div>
          <div class="bulk-tags-section">
            <h4>削除するタグ</h4>
            <div id="bulk-remove-tags-container" class="tag-container-box"></div>
            <div class="bulk-input-group">
              <input type="text" id="input-bulk-remove-tag" list="tag-suggestions" placeholder="タグを入力してEnterで削除リストへ">
            </div>
            </div>
          <div class="bulk-tags-section">
            <h4>ファイル操作</h4>
            <div class="bulk-file-ops">
              <button id="btn-bulk-copy">選択中をコピー...</button>
              <button id="btn-bulk-move">選択中を移動...</button>
              <button id="btn-bulk-delete" class="danger-btn">選択中を削除...</button>
            </div>
          </div>
        </div>
        <div class="overlay-footer">
           <button id="btn-bulk-apply" class="primary-btn">一括適用</button>
           <button id="btn-bulk-cancel">キャンセル (Space)</button>
        </div>
      </div>
    </div>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
