<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Photo Slide</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="dark-theme">
  <div id="app">
    <header id="top-bar">
      <div class="toolbar-row">
        <div class="toolbar-left">
          <button id="btn-open" title="画像フォルダを選択して開きます">フォルダを開く</button>
          <div class="file-info-group">
            <span id="file-name">ファイルを選択してください</span>
          </div>
          <div class="file-actions">
            <button id="btn-rename-trigger" title="ファイル名を変更する">✎</button>
          </div>
          <span id="display-mode-label">モード: 収まる</span>
        </div>
        <div class="toolbar-right">
          <div id="tag-editor">
            <div id="current-tags-container"></div>
            <div class="add-tag-group">
              <input type="text" id="input-single-tag" list="tag-suggestions" placeholder="タグを入力してEnter">
              <button id="btn-add-tag" title="新しいタグを追加する">+</button>
              <datalist id="tag-suggestions"></datalist>
            </div>
          </div>
        </div>
      </div>
      
      <div class="filter-row">
        <span class="label">タグ絞り込み:</span>
        <div id="all-tags-list"></div>
        <button id="btn-clear-filter" title="タグ絞り込みをリセットする">クリア</button>
      </div>
    </header>

    <div id="rename-modal" class="modal">
      <div class="modal-content">
        <h3>ファイル名の変更</h3>
        <input type="text" id="input-new-name">
        <div class="modal-buttons">
          <button id="btn-rename-cancel" title="変更を破棄して閉じる">キャンセル</button>
          <button id="btn-rename-confirm" title="新しいファイル名を保存する">適用</button>
        </div>
      </div>
    </div>

    <main id="viewer">
      <div id="welcome-view">
        <div class="welcome-content">
          <div class="welcome-icon">
            <img src="icon.png" alt="App Icon" class="welcome-icon-img">
          </div>
          <h2>ようこそ</h2>
          <p>「フォルダを開く」ボタンから画像フォルダを選択してください</p>
        </div>
      </div>
      <img id="main-image" src="" alt="Photo" style="display: none;">
      <div id="controls" class="hidden">
        <button id="btn-prev" title="前の画像へ (ArrowLeft / a)">◀</button>
        <button id="btn-next" title="次の画像へ (ArrowRight / d)">▶</button>
      </div>
    </main>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
